<title>Tendril Desktop Shell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* ── Harness tokens (Ink, one step muted) ─────────────────────────────── */
:root{
  --h-bg:#F7F6F2; --h-s2:#EFEEE9; --h-text:#1B1B18; --h-dim:#6B6A63; --h-faint:#959389;
  --h-accent:#4A5568; --h-soft:#E7EAEE; --h-soft-text:#3D4759; --h-border:#E0DED6; --h-ring:#4A556866;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --h-bg:#16181B; --h-s2:#1F2125; --h-text:#EDEDEF; --h-dim:#9B9DA3; --h-faint:#6A6C72;
    --h-accent:#8792A6; --h-soft:#262A33; --h-soft-text:#9BAAC2; --h-border:#2A2D33; --h-ring:#8792A666;
  }
}
:root[data-theme="dark"]{
  --h-bg:#16181B; --h-s2:#1F2125; --h-text:#EDEDEF; --h-dim:#9B9DA3; --h-faint:#6A6C72;
  --h-accent:#8792A6; --h-soft:#262A33; --h-soft-text:#9BAAC2; --h-border:#2A2D33; --h-ring:#8792A666;
}
*{box-sizing:border-box}
body{margin:0;background:var(--h-bg);color:var(--h-text);font:14px/1.5 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--h-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hz{max-width:1720px;margin:0 auto;padding:28px 28px 48px}
.hz-head{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.hz-head h1{font:600 26px/1.15 var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance}
.hz-head p{margin:6px 0 0;color:var(--h-dim);max-width:66ch}
.hz-head .eyebrow{font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--h-faint);margin-bottom:8px}
.presets{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.presets .lbl{color:var(--h-faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--h-border);border-radius:8px;overflow:hidden;background:var(--h-s2)}
.seg button{padding:6px 12px;color:var(--h-dim)}
.seg button[aria-pressed="true"]{background:var(--h-accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#12131A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#12131A}}

.hz-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:1100px){.hz-body{grid-template-columns:1fr}.panel{position:static!important}}
.stage{position:relative;overflow:hidden}
.stage-note{display:flex;gap:14px;color:var(--h-faint);font-size:12px;margin:10px 2px 0;flex-wrap:wrap}
.stage-note b{color:var(--h-dim);font-weight:500}
.win{transform-origin:top left;border:1px solid var(--h-border);border-radius:8px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(0,0,0,.45);background:var(--m-bg)}

/* ── Decisions panel ──────────────────────────────────────────────────── */
.panel{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.dec{border:1px solid var(--h-border);border-radius:10px;background:var(--h-s2);padding:12px 14px}
.dec h3{margin:0 0 2px;font:600 13px/1.3 var(--sans);display:flex;gap:8px;align-items:baseline}
.dec h3 .n{font:600 11px/1 var(--serif);color:var(--h-faint);min-width:18px}
.dec h3 .pr{margin-left:auto;font:500 10px/1 var(--sans);letter-spacing:.08em;color:var(--h-faint);text-transform:uppercase}
.dec p{margin:0 0 8px;color:var(--h-dim);font-size:12px;line-height:1.45}
.dec .ctl{display:flex;flex-wrap:wrap;gap:6px}
.dec .ctl.col{flex-direction:column;gap:4px}
.opt{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--h-border);border-radius:7px;background:var(--h-bg);font-size:12.5px;color:var(--h-dim)}
.opt[aria-pressed="true"]{border-color:var(--h-accent);color:var(--h-text);background:var(--h-soft)}
.opt.rec::after{content:"decided";font-size:10px;color:var(--h-faint);letter-spacing:.06em}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--h-text);cursor:pointer}
.chk input{accent-color:var(--h-accent);margin:0}
.dec .cons{margin:8px 0 0;font-size:11.5px;color:var(--h-faint);border-top:1px dashed var(--h-border);padding-top:6px}
.summary{border:1px solid var(--h-border);border-radius:10px;background:var(--h-bg);padding:12px 14px}
.summary h3{margin:0 0 6px;font:600 13px var(--sans)}
.summary textarea{width:100%;height:118px;font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--h-text);background:var(--h-s2);border:1px solid var(--h-border);border-radius:6px;padding:8px;resize:vertical}
.summary .row{display:flex;gap:8px;align-items:center;margin-top:6px}
.summary .row button{padding:5px 10px;border:1px solid var(--h-border);border-radius:7px;font-size:12px;color:var(--h-dim)}
.summary .row span{font-size:11.5px;color:var(--h-faint)}

/* ── Mock window tokens (Palette.kt, Ink) ────────────────────────────── */
.mk{
  --m-bg:#FFFFFF; --m-s2:#F1F0EC; --m-text:#1B1B18; --m-dim:#6B6A63; --m-faint:#959389;
  --m-accent:#4A5568; --m-accent-strong:#333D4D; --m-on-accent:#FFFFFF; --m-soft:#E7EAEE; --m-soft-text:#3D4759; --m-border:#E4E2DA;
  --m-tert:#7D5260; --m-tert-soft:#F5E1E8; --m-err:#8C1D18; --m-err-soft:#F9DEDC; --m-ok:#2F6B3A;
  --m-scrim:rgba(27,27,24,.32);
  --row:40px; --cell:200px; --list-fs:14px; --title-fs:26px;
  font:var(--list-fs)/1.45 var(--sans);color:var(--m-text);background:var(--m-bg);
  width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.mk[data-mock="dark"]{
  --m-bg:#1B1D21; --m-s2:#24262B; --m-text:#EDEDEF; --m-dim:#9B9DA3; --m-faint:#6A6C72;
  --m-accent:#8792A6; --m-accent-strong:#A9B3C4; --m-on-accent:#12131A; --m-soft:#262A33; --m-soft-text:#9BAAC2; --m-border:#2A2D33;
  --m-tert:#EFB8C8; --m-tert-soft:#3B2830; --m-err:#F2B8B5; --m-err-soft:#3B1F1E; --m-ok:#9FD3A7;
  --m-scrim:rgba(0,0,0,.5);
}

.titlebar{height:32px;display:flex;align-items:center;padding:0 12px;gap:10px;background:var(--m-s2);border-bottom:1px solid var(--m-border);font-size:12px;color:var(--m-dim);flex:none;user-select:none}
.titlebar .dot{width:10px;height:10px;border-radius:50%;background:var(--m-border)}
.titlebar .t{flex:1;text-align:center}
.titlebar .ctl{display:flex;gap:14px;color:var(--m-faint);font-size:13px}
.titlebar .badge{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--m-faint);border:1px solid var(--m-border);border-radius:4px;padding:1px 6px}

.frame{flex:1;display:flex;min-height:0}
.frame.bottom{flex-direction:column}

/* rail / sidebar */
.rail{flex:none;width:84px;background:var(--m-s2);border-right:1px solid var(--m-border);display:flex;flex-direction:column;padding:8px 0}
.rail .item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;color:var(--m-dim);font-size:11.5px;position:relative}
.rail .item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail .item .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.rail .item[aria-current="true"]{color:var(--m-text)}
.rail .item[aria-current="true"] .pill{background:var(--m-soft)}
.rail .item:hover .pill{background:var(--m-soft)}
.rail .spacer{flex:1}
.rail .foot{border-top:1px solid var(--m-border);padding:8px 6px 4px;font-size:10.5px;color:var(--m-dim);text-align:center;line-height:1.3}
.rail .foot b{display:block;color:var(--m-text);font-weight:500;font-variant-numeric:tabular-nums}
.side{flex:none;width:240px;background:var(--m-s2);border-right:1px solid var(--m-border);display:flex;flex-direction:column;padding:8px 0;font-size:13.5px}
.side .item{display:flex;align-items:center;gap:10px;padding:0 12px;height:32px;margin:0 6px;border-radius:6px;color:var(--m-dim)}
.side .item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .item[aria-current="true"]{background:var(--m-soft);color:var(--m-text)}
.side .item:hover{background:var(--m-soft)}
.side .sect{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--m-faint);padding:14px 18px 4px}
.side .foot{margin-top:auto;border-top:1px solid var(--m-border);padding:8px 14px;font-size:12px;color:var(--m-dim)}
.side .foot b{color:var(--m-text);font-weight:500;font-variant-numeric:tabular-nums}
u.mn{text-decoration:underline;text-underline-offset:2px}

.bottombar{flex:none;height:80px;border-top:1px solid var(--m-border);background:var(--m-s2);display:flex;justify-content:space-around;align-items:center}
.bottombar .item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--m-dim);font-size:12px;width:96px}
.bottombar .item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bottombar .item .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.bottombar .item[aria-current="true"]{color:var(--m-text)}
.bottombar .item[aria-current="true"] .pill{background:var(--m-soft)}
.timerbar{flex:none;height:36px;border-top:1px solid var(--m-border);background:var(--m-soft);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:13px;color:var(--m-soft-text)}
.timerbar b{font-weight:500;font-variant-numeric:tabular-nums}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--m-border)}
.topbar h2{margin:0;font:500 17px var(--sans);flex:1}
.ib{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;color:var(--m-dim)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--m-soft);color:var(--m-text)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--m-border);border-radius:8px;font-size:12.5px;color:var(--m-dim);background:var(--m-bg)}
.chip[aria-pressed="true"]{background:var(--m-soft);border-color:var(--m-soft);color:var(--m-soft-text)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.qadd{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--m-border);border-radius:8px;color:var(--m-faint);font-size:13px;width:260px}
.qadd kbd{margin-left:auto}
kbd{font:11px/1 var(--sans);color:var(--m-faint);border:1px solid var(--m-border);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--m-bg)}

/* two-pane */
.split{flex:1;display:flex;min-height:0}
.tree{flex:none;width:var(--treew,280px);border-right:1px solid var(--m-border);display:flex;flex-direction:column;min-width:0;position:relative}
.tree.hidden{display:none}
.tree .hd{height:44px;display:flex;align-items:center;gap:6px;padding:0 8px 0 14px;border-bottom:1px solid var(--m-border);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--m-faint)}
.tree .hd .ib{margin-left:auto;width:28px;height:28px}
.tree .list{overflow:auto;padding:6px 0}
.handle{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:2}
.handle:hover::after,.handle.on::after{content:"";position:absolute;left:3px;top:0;width:2px;height:100%;background:var(--m-accent)}
.row{display:flex;align-items:center;gap:10px;height:var(--row);padding:0 12px;min-width:0;color:var(--m-text)}
.row:hover{background:var(--m-s2)}
.row[aria-current="true"]{background:var(--m-soft);color:var(--m-soft-text)}
.row .ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.row .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--m-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .more{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;color:var(--m-faint);flex:none}
.row .more svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.mk[data-hover="1"] .row .more{opacity:0}
.mk[data-hover="1"] .row:hover .more,.mk[data-hover="1"] .row:focus-within .more{opacity:1}
.row.d1{padding-left:30px}.row.d2{padding-left:48px}
.row .cb{width:16px;height:16px;border:1.6px solid var(--m-dim);border-radius:4px;flex:none;display:grid;place-items:center}
.row .cb.on{background:var(--m-accent);border-color:var(--m-accent)}
.row .cb.on::after{content:"";width:8px;height:5px;border-left:2px solid var(--m-on-accent);border-bottom:2px solid var(--m-on-accent);transform:translateY(-1px) rotate(-45deg)}
.row .lab{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--m-soft);color:var(--m-soft-text)}
.row .blocked{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--m-err-soft);color:var(--m-err)}
.row.done .tt{color:var(--m-faint);text-decoration:line-through}

.detail{flex:1;min-width:0;overflow:auto;position:relative}
.page{max-width:720px;margin:0 auto;padding:36px 48px 80px}
.mk[data-density="48"] .page{padding:20px 20px 80px}
.page h1{font:600 var(--title-fs)/1.2 var(--sans);margin:0 0 6px;letter-spacing:-.01em}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px;font-size:12.5px;color:var(--m-dim)}
.strip .k{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:6px;background:var(--m-s2)}
.strip .k b{font-weight:500;color:var(--m-text)}
.strip .k.bl{background:var(--m-err-soft);color:var(--m-err)}
.blk{position:relative;padding:5px 0;line-height:1.55}
.blk.sel{background:var(--m-soft);border-radius:4px;padding:5px 6px;margin:44px -6px 0}
.blk.sel .selx{background:var(--m-accent);color:var(--m-on-accent);border-radius:2px}
.blk .todo{display:flex;gap:10px;align-items:flex-start}
.blk .todo .cb{margin-top:4px;width:16px;height:16px;border:1.6px solid var(--m-dim);border-radius:4px;flex:none}
.blk h3{margin:14px 0 4px;font:600 18px var(--sans)}
.ref{display:flex;gap:12px;border-left:3px solid var(--m-tert);background:var(--m-s2);border-radius:0 8px 8px 0;padding:8px 12px;margin:6px 0}
.ref .q{flex:1}
.ref .src{font-size:12px;color:var(--m-faint);margin-top:4px}
.ref .src b{color:var(--m-tert);font-weight:500}
.ftb{position:absolute;top:-38px;left:0;display:flex;align-items:center;gap:2px;background:var(--m-bg);border:1px solid var(--m-border);border-radius:8px;padding:3px;box-shadow:0 8px 20px -10px rgba(0,0,0,.4);z-index:3}
.ftb button{height:26px;min-width:26px;padding:0 7px;border-radius:5px;font-size:13px;color:var(--m-dim)}
.ftb button:hover{background:var(--m-soft);color:var(--m-text)}
.ftb .sep{width:1px;height:16px;background:var(--m-border);margin:0 3px}
.ftb .ai{color:var(--m-soft-text);font-weight:500}
.mk[data-density="48"] .ftb{position:static;margin:8px 0;box-shadow:none;width:max-content}
.mk[data-density="48"] .blk.sel{margin-top:0}
.backl{margin-top:34px;border-top:1px solid var(--m-border);padding-top:14px}
.backl .hd{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--m-faint);margin-bottom:6px}
.backl .m{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.backl .m .p{color:var(--m-dim);flex:1}
.backl .m .p b{color:var(--m-text);font-weight:500}
.backl .m button{font-size:12.5px;color:var(--m-accent);font-weight:500;padding:3px 8px;border-radius:6px}
.backl .m button:hover{background:var(--m-soft)}

/* menus, dialogs, sheets */
.menu{position:absolute;right:14px;top:50px;min-width:200px;background:var(--m-bg);border:1px solid var(--m-border);border-radius:8px;box-shadow:0 12px 28px -14px rgba(0,0,0,.5);padding:6px;z-index:5}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:5px;font-size:13.5px}
.menu button:hover{background:var(--m-soft)}
.menu .sep{height:1px;background:var(--m-border);margin:4px 0}
.scrim{position:absolute;inset:0;background:var(--m-scrim);z-index:8;display:flex}
.dlg{background:var(--m-bg);border-radius:14px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.scrim.center{align-items:center;justify-content:center}
.scrim.center .dlg{width:560px;max-height:80%}
.scrim.right{justify-content:flex-end}
.scrim.right .dlg{width:440px;height:100%;border-radius:0;box-shadow:-20px 0 50px -30px rgba(0,0,0,.6)}
.scrim.sheet{align-items:flex-end;justify-content:center}
.scrim.sheet .dlg{width:100%;height:92%;border-radius:22px 22px 0 0}
.scrim.sheet .dlg::before{content:"";width:32px;height:4px;border-radius:2px;background:var(--m-border);margin:10px auto 0}
.dlg .hd{display:flex;align-items:center;padding:16px 20px 8px;font:500 18px var(--sans)}
.dlg .hd .ib{margin-left:auto}
.dlg .bd{padding:4px 20px 20px;overflow:auto;font-size:13.5px}
.rev{display:flex;gap:12px;align-items:center;height:44px;border-bottom:1px solid var(--m-border)}
.rev .w{color:var(--m-dim);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;width:88px}
.rev .r{flex:1}
.rev .c{color:var(--m-faint);font-size:12.5px}
.rev button{font-size:12.5px;color:var(--m-accent);font-weight:500}
.btn{display:inline-flex;align-items:center;height:36px;padding:0 18px;border-radius:18px;background:var(--m-accent);color:var(--m-on-accent);font-weight:500;font-size:13.5px}
.btn.txt{background:none;color:var(--m-accent)}
.dlg .bd .acts{display:flex;gap:8px;margin-top:16px}
.dlg .bd .cap{font-size:11.5px;color:var(--m-faint);margin-top:14px}
.dlg .pv{background:var(--m-s2);border-radius:8px;padding:12px 14px;margin:8px 0;line-height:1.5}
.dlg .pv b{display:block;font-weight:600;margin-bottom:4px}

/* switcher / help */
.pal{position:absolute;left:50%;top:80px;transform:translateX(-50%);width:560px;background:var(--m-bg);border:1px solid var(--m-border);border-radius:12px;box-shadow:0 30px 60px -28px rgba(0,0,0,.6);z-index:9;overflow:hidden}
.pal .in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--m-border);font-size:15px}
.pal .in span{color:var(--m-faint)}
.pal .in .cur{width:1px;height:18px;background:var(--m-text);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pal .r{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;font-size:13.5px}
.pal .r[aria-current="true"]{background:var(--m-soft)}
.pal .r .k{margin-left:auto;font-size:11.5px;color:var(--m-faint)}
.pal .ft{padding:8px 16px;font-size:11.5px;color:var(--m-faint);border-top:1px solid var(--m-border);display:flex;gap:14px}

  } else {

  }

  <div class="dec"${dis}><h3><span class="n">7</span>Theme on desktop<span class="pr">14g</span></h3><p>The picker reaches the desktop Settings pane.</p>
    <div class="ctl">${opt('theme','system','Follow system',true)}${opt('theme','light','Light')}${opt('theme','dark','Dark')}</div></div>
  <div class="summary"><h3>Your answers</h3><textarea readonly id="sum"></textarea><div class="row"><button data-act="copy">Copy</button><span id="copied">paste them back in chat, by number</span></div></div>`;
  $('#sum').value=summary();
  document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',S.preset===b.dataset.preset));
  document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(S.width)===b.dataset.width));
}
function summary(){
  return [`1 nav: ${S.nav}`,`2 sheets: ${S.modal}`,`3 tree: ${S.treeResize?'resizable':'fixed'}, ${S.treeCollapse?'collapsible':'always shown'}`,`4 density: ${({'36':'compact 0.9x','40':'comfortable 1x','48':'touch 1.3x'})[S.density]} (proportional), hover-only ${S.hoverOnly?'yes':'no'}`,`5 mnemonics: ${S.mnemonics?'yes':'no'}`,`6 calendar: ${S.calDefault}`,`7 theme: ${S.theme}`].join('\n');
}

/* events */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-preset],[data-width],[data-k],[data-ck],[data-tab],[data-page],[data-task],[data-act],[data-cal],[data-theme]');
  if(!t)return;
  if(t.dataset.preset){S.preset=t.dataset.preset; Object.assign(S,S.preset==='today'?TODAY_PRESET:PROPOSED); S.calMode=null; S.sheet=null; return render();}
  if(t.dataset.width){S.width=+t.dataset.width; S.sheet=null; S.pageOpenNarrow=false; return render();}
  if(t.dataset.k){S[t.dataset.k]=t.dataset.v; if(t.dataset.k==='calDefault')S.calMode=null; return render();}
  if(t.dataset.ck!==undefined){S[t.dataset.ck]=t.checked; if(t.dataset.ck==='treeCollapse')S.treeOpen=true; return render();}
  if(t.dataset.theme){S.theme=t.dataset.theme; return render();}
  if(t.dataset.tab){S.tab=t.dataset.tab; S.menu=false; S.pageOpenNarrow=false; return render();}
  if(t.dataset.page){S.page=t.dataset.page; S.tab='pages'; S.pageOpenNarrow=true; S.menu=false; return render();}
  if(t.dataset.task){S.task=t.dataset.task; return render();}
  if(t.dataset.cal){S.calMode=t.dataset.cal; return render();}
  const a=t.dataset.act;
  if(a==='menu'||a==='menu2'){S.menu=!S.menu; return render();}
  if(a==='history'){S.menu=false;S.sheet='history';S.preview=false; return render();}
  if(a==='calsettings'){S.menu=false;S.sheet='calsettings'; return render();}
  if(a==='preview'){S.preview=true; return render();}
  if(a==='closesheet'){S.sheet=null; return render();}
  if(a==='closeall'){S.switcher=false;S.help=false;S.menu=false; return render();}
  if(a==='switcher'){S.switcher=true; return render();}
  if(a==='collapse'){S.treeOpen=false; return render();}
  if(a==='expand'){S.treeOpen=true; return render();}
  if(a==='backlist'){S.pageOpenNarrow=false; return render();}
  if(a==='mapj'){S.mapJournal=!S.mapJournal; return render();}
  if(a==='toast'){toast(t.dataset.msg); return;}
  if(a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(summary()).then(()=>{$('#copied').textContent='copied';},()=>{$('#copied').textContent='select the text and copy';}); return;}
});
document.addEventListener('keydown',ev=>{
  const inField=/INPUT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName);
  if(ev.key==='Escape'){ if(S.sheet||S.switcher||S.help||S.menu){S.sheet=null;S.switcher=false;S.help=false;S.menu=false;} else if(S.pageOpenNarrow){S.pageOpenNarrow=false;} return render(); }
  if(inField)return;
  if(ev.ctrlKey&&ev.key.toLowerCase()==='k'){ev.preventDefault();S.switcher=!S.switcher;return render();}
  if(ev.ctrlKey&&ev.key==='\\'){ev.preventDefault(); if(S.treeCollapse&&eff().twoPane&&eff().nav!=='sidebar'){S.treeOpen=!S.treeOpen;render();} return;}
  if(ev.key==='?'){S.help=!S.help;return render();}
  if(!ev.ctrlKey&&!ev.altKey&&/^[1-5]$/.test(ev.key)){S.tab=TABS[+ev.key-1][0];S.pageOpenNarrow=false;return render();}
});
function toast(msg){S.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render();},2200);}
function bindHandle(h){
  h.addEventListener('mousedown',e=>{
    e.preventDefault(); h.classList.add('on');
    const scale=$('#win').getBoundingClientRect().width/S.width;
    const start=e.clientX, w0=S.treeW, tree=h.parentElement;
    const mv=m=>{S.treeW=Math.max(200,Math.min(440,w0+(m.clientX-start)/scale)); tree.style.setProperty('--treew',S.treeW+'px');};
    const up=()=>{h.classList.remove('on');removeEventListener('mousemove',mv);removeEventListener('mouseup',up);save();};
    addEventListener('mousemove',mv); addEventListener('mouseup',up);
  });
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();
})();
</script>
