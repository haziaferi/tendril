# Builds all three Gradle projects and runs the JVM unit tests.
#
# There is deliberately no root wrapper (README, "Building"): `Tendril android/`, `shared/` and
# `Tendril windows/` are three separate builds that happen to live in one repository, because both
# consumers resolve the shared core as `includeBuild("../shared")` — a *relative sibling* path only
# a single clone reproduces (tendril-spec.md §11). So this workflow runs three wrappers rather than
# one, mirroring exactly what the README tells a person to run by hand.
#
# The Android SDK is needed by the Android build and by `shared`, which has an `android` target as
# well as a `desktop` one. It is supplied by the runner image rather than by a setup step (see
# below). This comment used to claim the desktop build needed it too, via the composite build of
# `shared`; the run of 2026-09-23 disproved that — `shared build` passed on a runner whose Android
# setup step had failed, and the desktop build failed for an unrelated toolchain reason. A comment
# is not evidence, which is the general lesson and the reason this one now cites a run.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run still in flight for the same branch, rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 21 — AGP's floor is 17, and gradle-daemon-jvm.properties pins toolchainVersion=21.
      # Providing it here keeps Gradle from provisioning its own through foojay on every run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `android-actions/setup-android@v3` used to sit here, to install cmdline-tools and accept
      # the SDK licences. Removed 2026-09-23: on the current runner image it fails outright —
      # "Failed to find package 'tools'", then sdkmanager exits 1 — because it still asks for the
      # retired `tools` package. Being the fourth step, its failure skipped `setup-gradle` and the
      # Android build behind it, so this workflow could not have gone green whatever the code did.
      #
      # It is not replaced, because it turns out not to be needed: `audit.yml`'s `unit-tests` job
      # builds and tests the same app with no Android setup step at all and passes, the runner
      # image shipping an SDK whose licences are already accepted. That is the evidence for
      # deleting rather than pinning a version — a green run of the same compile, not a guess.
      # If a future image does drop the SDK, the symptom is a licence or missing-platform error in
      # the Android step below, and the fix is `setup-android` back with an explicit
      # `with: packages: 'platforms;android-37'`.

      # Caches ~/.gradle across runs and writes a build summary on the job page. Deliberately no
      # --no-daemon on the wrapper calls below: this action manages the daemon, and killing it
      # stops the cache being written.
      - uses: gradle/actions/setup-gradle@v4

      # The one that matters most — the APK plus every JVM unit test in the repo. Quoted because
      # the folder name contains a space.
      - name: Android — assemble + unit tests
        working-directory: 'Tendril android'
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      # Both of the remaining builds run even when the one above failed, so a single run reports
      # all three results instead of only the first failure.
      - name: Shared KMP core — both targets
        if: ${{ !cancelled() }}
        working-directory: shared
        run: ./gradlew build

      - name: Desktop companion
        if: ${{ !cancelled() }}
        working-directory: 'Tendril windows'
        run: ./gradlew build

      # A failed Kotlin test says little in the console log; the HTML report says which assertion.
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14
