# Static hygiene checks (tools/audit.py). Deliberately does NOT build the app:
# the three Gradle builds need the Android SDK and a full dependency download,
# while these checks are pure text analysis and finish in seconds. They exist to
# catch the specific defect classes this repo has actually had — see the module
# docstring in tools/audit.py for the list and the reason behind each one.
name: audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static hygiene checks
        run: python3 tools/audit.py
