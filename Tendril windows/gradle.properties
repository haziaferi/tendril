# L5 — the JetBrains Runtime the toolchain resolves (`build.gradle.kts`): Android Studio's copy.
#
# This path is deliberately machine-specific and deliberately stays. It is the only thing that
# makes `jetbrainsRuntime` resolve on the developer's machine, and therefore the only thing that
# gives the built app its custom title bar; removing it to tidy the file would silently downgrade
# the window to the OS one and nothing would fail.
#
# Elsewhere it is inert. A non-Windows Gradle treats it as relative and logs one warning naming a
# path that cannot exist ("…/Tendril windows/C:/Program Files/…"), then carries on: `build.gradle.kts`
# falls back to any JDK 21 when no JBR is found. That warning in a CI log is expected output, not a
# fault to chase — it was on screen for the whole of the 2026-09-23 investigation and was not the
# cause of anything.
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr
