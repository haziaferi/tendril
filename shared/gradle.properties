# Milestone 3 — compiling the ported Workbench UI (Compose codegen, coroutine state machines in
# PageDetailScreen/PageDatabaseScreen) needs more heap than the Kotlin daemon's default for the
# desktop target; bumped after a real OutOfMemoryError during ':compileKotlinDesktop'.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
